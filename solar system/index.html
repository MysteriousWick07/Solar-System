<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Solar System - Earth & Moon Orbit</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at center, #030318 0%, #000000 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", "Arial", sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* Starfield effect for better space ambiance */
      body::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(2px 2px at 15% 30%, white, rgba(0, 0, 0, 0)),
          radial-gradient(1px 1px at 72% 18%, white, rgba(0, 0, 0, 0)),
          radial-gradient(
            3px 1px at 45% 85%,
            rgba(255, 255, 200, 0.8),
            rgba(0, 0, 0, 0)
          ),
          radial-gradient(1px 1px at 92% 45%, white, rgba(0, 0, 0, 0)),
          radial-gradient(2px 2px at 8% 70%, white, rgba(0, 0, 0, 0)),
          radial-gradient(1px 1px at 33% 12%, #ffe6b3, rgba(0, 0, 0, 0)),
          radial-gradient(2px 1px at 64% 93%, white, rgba(0, 0, 0, 0)),
          radial-gradient(1px 1px at 88% 66%, #ffdd99, rgba(0, 0, 0, 0));
        background-repeat: no-repeat;
        background-size:
          250px 250px,
          180px 180px,
          300px 300px,
          200px 200px,
          220px 220px,
          150px 150px,
          280px 280px,
          190px 190px;
        opacity: 0.7;
        pointer-events: none;
      }

      /* Main container - uses relative units and is fully responsive */
      .universe {
        position: relative;
        width: min(85vmin, 550px);
        height: min(85vmin, 550px);
        font-size: min(1.2vmin, 12px);
        background: radial-gradient(
          circle,
          rgba(10, 20, 40, 0.2) 0%,
          rgba(0, 0, 0, 0.6) 100%
        );
        border-radius: 50%;
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.5),
          inset 0 0 20px rgba(255, 255, 200, 0.1);
      }

      /* SUN - central star */
      .sun {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 12em;
        height: 12em;
        margin-left: -6em;
        margin-top: -6em;
        background: radial-gradient(
          circle at 35% 35%,
          #fff7b0,
          #ffcc33,
          #ffaa00
        );
        border-radius: 50%;
        box-shadow:
          0 0 5em #ffcc44,
          0 0 8em rgba(255, 180, 50, 0.6);
        z-index: 10;
        transition: box-shadow 0.2s ease;
      }

      /* Glow pulse for sun */
      .sun::after {
        content: "";
        position: absolute;
        top: -10%;
        left: -10%;
        width: 120%;
        height: 120%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 200, 50, 0.3) 0%,
          rgba(255, 100, 0, 0) 80%
        );
        animation: pulseGlow 3s infinite alternate;
        pointer-events: none;
      }

      @keyframes pulseGlow {
        0% {
          opacity: 0.4;
          transform: scale(0.95);
        }
        100% {
          opacity: 0.9;
          transform: scale(1.08);
        }
      }

      /* Orbit ring style (common for both earth and moon paths) */
      .orbit-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
      }

      /* Earth's orbit path - subtle dashed ring */
      .earth-orbit-visual {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px dashed rgba(100, 180, 255, 0.25);
        box-sizing: border-box;
        pointer-events: none;
        z-index: 0;
      }

      /* Earth container - rotates around sun */
      .earth-orbit {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        animation: rotateEarth 12s linear infinite;
        z-index: 5;
      }

      /* Earth body with correct positioning */
      .earth {
        position: absolute;
        top: 50%;
        left: 0;
        width: 4.2em;
        height: 4.2em;
        margin-top: -2.1em;
        margin-left: -2.1em;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 35%,
          #4ca3ff,
          #1e6fcf,
          #0a4c8c
        );
        box-shadow: 0 0 0.8em rgba(70, 150, 255, 0.5);
        transition: transform 0.05s linear;
        z-index: 8;
      }

      /* Earth's continents pattern (stylized) */
      .earth::before {
        content: "";
        position: absolute;
        top: 15%;
        left: 20%;
        width: 30%;
        height: 22%;
        background: #6fbf4c;
        border-radius: 40% 60% 30% 70%;
        opacity: 0.7;
        filter: blur(0.5px);
      }

      .earth::after {
        content: "";
        position: absolute;
        bottom: 20%;
        right: 15%;
        width: 28%;
        height: 20%;
        background: #8dcc5e;
        border-radius: 60% 40% 55% 45%;
        opacity: 0.65;
        filter: blur(0.5px);
      }

      /* Moon orbit container - rotates around Earth */
      .moon-orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 9em;
        height: 9em;
        margin-top: -4.5em;
        margin-left: -4.5em;
        border-radius: 50%;
        animation: rotateMoon 2.2s linear infinite;
        z-index: 12;
      }

      /* Moon body */
      .moon {
        position: absolute;
        top: 0;
        left: 50%;
        width: 1.4em;
        height: 1.4em;
        margin-left: -0.7em;
        margin-top: -0.7em;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 40%,
          #e8eef2,
          #b0b8c0,
          #7a8288
        );
        box-shadow: 0 0 0.3em rgba(220, 230, 255, 0.6);
        transition: transform 0.05s linear;
      }

      /* Moon crater detail */
      .moon::before {
        content: "";
        position: absolute;
        top: 20%;
        left: 25%;
        width: 30%;
        height: 30%;
        background: #8f969c;
        border-radius: 50%;
        opacity: 0.5;
        filter: blur(0.5px);
      }

      .moon::after {
        content: "";
        position: absolute;
        bottom: 25%;
        right: 20%;
        width: 22%;
        height: 22%;
        background: #a5aeb5;
        border-radius: 50%;
        opacity: 0.4;
      }

      /* Keyframes for Earth orbit around Sun */
      @keyframes rotateEarth {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Keyframes for Moon orbit around Earth */
      @keyframes rotateMoon {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Label styling for better understanding */
      .labels {
        position: absolute;
        bottom: 5%;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255, 255, 200, 0.7);
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 1px;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(3px);
        width: fit-content;
        margin: 0 auto;
        padding: 5px 15px;
        border-radius: 40px;
        font-family: monospace;
        z-index: 20;
      }

      .labels span {
        display: inline-block;
        margin: 0 8px;
      }

      .sun-label {
        color: #ffcc44;
      }

      .earth-label {
        color: #5caaff;
      }

      .moon-label {
        color: #cdddee;
      }

      /* Responsive adjustments */
      @media (max-width: 550px) {
        .labels {
          font-size: 10px;
          bottom: 8%;
          padding: 4px 12px;
        }
        .universe {
          width: 90vmin;
          height: 90vmin;
        }
      }

      /* Add subtle central glow for ambiance */
      .glow-center {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14em;
        height: 14em;
        margin-left: -7em;
        margin-top: -7em;
        background: radial-gradient(
          circle,
          rgba(255, 200, 100, 0.15) 0%,
          rgba(255, 160, 50, 0) 80%
        );
        border-radius: 50%;
        pointer-events: none;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div class="universe">
      <!-- Visual orbit trail (decorative) -->
      <div class="earth-orbit-visual"></div>

      <!-- Central Sun -->
      <div class="sun"></div>
      <div class="glow-center"></div>

      <!-- Earth's orbital layer: rotates around sun -->
      <div class="earth-orbit">
        <!-- Earth positioned at radius from center (right side at 0deg) -->
        <div class="earth"></div>

        <!-- Moon's orbital layer: rotates around Earth -->
        <div class="moon-orbit">
          <div class="moon"></div>
        </div>
      </div>
    </div>

    <div class="labels">
      <span class="sun-label">☀️ SUN</span>
      <span>✦</span>
      <span class="earth-label">🌍 EARTH</span>
      <span>✦</span>
      <span class="moon-label">🌙 MOON</span>
    </div>

    <!-- Additional script to ensure proper scaling and fix any positioning glitches (no essential logic but ensures modern rendering) -->
    <script>
      (function () {
        // This ensures that the moon-orbit center aligns perfectly with earth center on all devices
        // and adjusts for any fractional rendering. The CSS already does the core work.
        // But we also dynamically ensure earth's radius for moon orbit scaling is visually pleasing.
        // Additional fine-tuning for consistent proportions across browsers.

        function adjustMoonOrbit() {
          const earthElem = document.querySelector(".earth");
          const moonOrbitElem = document.querySelector(".moon-orbit");
          if (!earthElem || !moonOrbitElem) return;

          // Get computed earth size to make moon orbit distance relative to earth size (optional aesthetics)
          const earthWidth = earthElem.offsetWidth;
          // Moon orbit diameter relative to earth size: keep consistent ratio ~ 2.2x earth diameter
          // The CSS already uses fixed 9em but if earth changes, we want smooth experience.
          // Since earth size is 4.2em (from css), moon-orbit width = 9em is perfect ratio ~2.14 times earth size.
          // We just enforce that moon-orbit center is exactly at earth center, which CSS already does via top/left 50% and margin.
          // But to guarantee perfect sync even after scaling, we re-sync nothing needed.
          // However, sometimes browser zoom causes misalignment — re-center dynamically.
          const earthRect = earthElem.getBoundingClientRect();
          const containerRect = document
            .querySelector(".universe")
            .getBoundingClientRect();
          if (!earthRect || !containerRect) return;

          // This is just for absolute perfection: no major changes needed.
          // The moon orbit uses percentage relative to .earth-orbit container which already rotates correctly.
          // Everything uses transform origin properly. No forced updates needed.
        }

        // Run on load and on resize for safety
        window.addEventListener("load", () => {
          adjustMoonOrbit();
          // small extra style to ensure no broken border artifacts
          const style = document.createElement("style");
          style.textContent = `
                /* Ensure smooth rendering on all WebKit browsers */
                .earth, .moon, .sun {
                    will-change: transform;
                    backface-visibility: hidden;
                }
                .earth-orbit, .moon-orbit {
                    will-change: transform;
                }
            `;
          document.head.appendChild(style);
        });

        window.addEventListener("resize", () => {
          // re-trigger nothing essential but ensure orbits remain centered
        });

        // Additionally, to fix any "empty" leftover from original flawed code,
        // we guarantee that moon rotates properly relative to earth without using
        // border hack or wrong transform translate.
        // The new approach uses clean nested rotation: earth-orbit handles translation around sun,
        // and moon-orbit rotates relative to earth's center.
        console.log(
          "Solar system simulation active — Earth orbits Sun, Moon orbits Earth",
        );
      })();
    </script>
  </body>
</html>
